name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它初始化时会找已被移除的 `tools` 包，
      # 2026-11-08 的 run 42491705173 就是在这里失败的。ubuntu-latest 自带
      # Android SDK 与 sdkmanager，直接装本项目需要的平台与 build-tools。
      - name: Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # 约定检查：JSON 设置读改写必须包在 Prefs.editJson（防止并发丢更新回退）。
      - name: Convention check
        run: python tools/check_prefs_rmw.py

      # lint 基线为 0 error；出现新的 error 会让任务失败。
      - name: Lint
        run: bash ./gradlew :app:lintDebug --console=plain --no-daemon

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
