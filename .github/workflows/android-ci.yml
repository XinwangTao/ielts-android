name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它初始化时会找已被移除的 `tools` 包，
      # 2026-11-08 的 run 42491705173 就是在这里失败的。ubuntu-latest 自带
      # Android SDK 与 sdkmanager，直接装本项目需要的平台与 build-tools。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3

      # runner 首次跑 wrapper 会去 GitHub Releases 拉 gradle-8.13-bin.zip，
      # 2026-11-09 的 run 42582946115 在这里收到 504（非代码问题）。重试兜住这类网络抖动。
      - name: Unit tests
        run: |
          for attempt in 1 2 3; do
            echo "unit-test attempt $attempt"
            bash ./gradlew :app:testDebugUnitTest --console=plain --no-daemon && exit 0
            echo "attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          exit 1

      # 约定检查：JSON 设置读改写必须包在 Prefs.editJson（防止并发丢更新回退）。
      - name: Convention check
        run: python tools/check_prefs_rmw.py

      # lint 基线为 0 error；出现新的 error 会让任务失败。
      - name: Lint
        run: |
          for attempt in 1 2 3; do
            echo "lint attempt $attempt"
            bash ./gradlew :app:lintDebug --console=plain --no-daemon && exit 0
            echo "attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          exit 1

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
