name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # compileSdk = 35：显式装平台与 build-tools，避免依赖 Gradle 的自动下载策略。
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # lint 基线为 0 error；出现新的 error 会让任务失败。
      - name: Lint
        run: bash ./gradlew :app:lintDebug --console=plain --no-daemon

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
